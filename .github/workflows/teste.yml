name: Testes Java - IMC

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Executar testes
        run: mvn clean test